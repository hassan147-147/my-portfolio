<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sent - Hassan Naveed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@300..700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0b0e14;
        color: #f3f1ea;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .container {
        text-align: center;
        max-width: 480px;
        animation: fadeInUp 0.6s ease-out;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .icon-circle {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(74, 92, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        animation: popIn 0.4s ease-out 0.2s both;
      }
      @keyframes popIn {
        from { transform: scale(0); }
        to { transform: scale(1); }
      }
      .checkmark {
        width: 48px;
        height: 48px;
        color: #7c88ff;
      }
      .checkmark-circle {
        stroke-dasharray: 166;
        stroke-dashoffset: 166;
        animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.4s forwards;
      }
      .checkmark-check {
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
      }
      @keyframes stroke {
        100% { stroke-dashoffset: 0; }
      }
      h1 {
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .subtitle {
        color: #7c88ff;
        font-size: 1.15rem;
        font-weight: 500;
        margin-bottom: 12px;
      }
      .message {
        color: #9aa3b8;
        font-size: 1rem;
        line-height: 1.7;
        margin-bottom: 40px;
      }
      .divider {
        height: 1px;
        background: rgba(243, 241, 234, 0.1);
        margin-bottom: 40px;
      }
      .contact-info {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-bottom: 40px;
        color: #9aa3b8;
        font-size: 0.875rem;
      }
      .contact-info a {
        color: #9aa3b8;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
      }
      .contact-info a:hover { color: #f3f1ea; }
      .contact-info svg {
        width: 16px;
        height: 16px;
        color: #7c88ff;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px;
        border-radius: 999px;
        background: #4a5cff;
        color: #f3f1ea;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn:hover {
        background: #7c88ff;
        box-shadow: 0 8px 30px rgba(74, 92, 255, 0.25);
      }
      .btn svg {
        width: 16px;
        height: 16px;
        transition: transform 0.2s;
      }
      .btn:hover svg { transform: translateX(-4px); }
      .footer {
        margin-top: 60px;
        font-size: 0.75rem;
        color: #9aa3b8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-circle">
        <svg class="checkmark" viewBox="0 0 52 52">
          <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none" stroke="#7c88ff" stroke-width="2"/>
          <path class="checkmark-check" fill="none" stroke="#7c88ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14 27l7 7 16-16"/>
        </svg>
      </div>

      <h1>Thank You!</h1>
      <p class="subtitle">Your message has been sent successfully.</p>
      <p class="message">
        I'll get back to you as soon as possible. Usually within 24 hours.<br/>
        Thanks for reaching out — I appreciate your interest!
      </p>

      <div class="divider"></div>

      <div class="contact-info">
        <a href="mailto:hassan16naveed@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          hassan16naveed@gmail.com
        </a>
        <a href="tel:+923192945394">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          +92 319 2945394
        </a>
      </div>

      <a href="/" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Back to Portfolio
      </a>

      <p class="footer">Hassan Naveed — Web Developer &amp; Graphic Designer</p>
    </div>
  </body>
</html>
